[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topobathykit"
version = "0.1.0"
description = "Policy-driven topobathymetric fusion: fuses overlapping elevation sources into seamless grids with per-pixel provenance."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Daniel Fry", email = "dfry@lhzn.io" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  # Core scientific stack
  "xarray",
  "rioxarray",
  "zarr>=3.1",
  "numcodecs>=0.16",
  "numpy",
  "scipy",
  "pandas",
  "geopandas",
  "shapely",
  "pyproj",
  "rasterio",
  "affine",
  "dask",
  "bmi-topography",
  "pyogrio",
  # Data access
  "pydap",
  "fsspec",
  "s3fs",
  "requests",
  "httpx",
  "planetary-computer",
  "pystac-client",
  # Point cloud
  "pdal",
  "laspy",
  "lazrs",
  "h5py",
  # Policy & config
  "pydantic>=2.0",
  "pyyaml",
  "python-dotenv",
  "filelock",
  # Visualization
  "matplotlib",
  # CLI
  "questionary",
  "rich",
  # Service (used by topobathyserve)
  "uvicorn",
  "fastapi",
]

[tool.hatch.build.targets.wheel]
# topobathysim is a one-release alias for the package's former name.
packages = ["src/topobathykit", "src/topobathysim"]

[project.urls]
Documentation = "https://topobathysim.docs.lhzn.io"
Issues = "https://github.com/lhzn-io/topobathykit/issues"
Source = "https://github.com/lhzn-io/topobathykit"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=src/topobathykit --cov=tests {args:tests}"

[tool.pytest.ini_options]
addopts = "-v -m 'not network'"
testpaths = ["tests"]
# service/ carries the FastAPI app, whose modules import each other absolutely
# (`from topobathyserve.models import ...`), matching WORKDIR=service in the
# container and run_server.py. Tests import it as `service.topobathyserve.main`
# from the repo root, so both roots must be importable.
pythonpath = ["src", "service"]
markers = [
    "integration: mark a test as an integration test",
    "network: mark a test as requiring heavy external network/API access",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    # RUF046 (unnecessary-cast-to-int) fires 20 times on int(round(...)) in
    # service/topobathyserve/routers/dem_viewer.py. Those casts are deliberate:
    # the operands are numpy scalars, whose __round__ returns a numpy type
    # rather than a Python int, so dropping the cast silently changes the type
    # flowing into slice indices and mosaic extent arithmetic. Ruff classifies
    # every one of these fixes as unsafe and its own documentation lists
    # round() over such values as a known false positive. The rounding is also
    # load-bearing: it is what makes adjacent cells share exactly one boundary
    # pixel instead of leaving a one-column NaN seam.
    "RUF046",
]

[tool.ruff.lint.isort]
known-first-party = ["topobathykit"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"

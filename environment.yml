name: topobathysim
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  # Core scientific stack
  - xarray
  - rioxarray
  - zarr>=3.1
  - numcodecs>=0.16
  - numpy
  - scipy
  - pandas
  - geopandas
  - shapely
  - pyproj
  - rasterio
  - affine
  - gdal
  - dask
  # Data access
  - bmi-topography=0.9.0
  - fsspec
  - s3fs
  - requests
  - planetary-computer
  - pystac-client
  # Point cloud
  - pdal
  - python-pdal
  - laspy
  - lazrs-python
  - h5py
  # Policy & config
  - pydantic>=2.0
  - pyyaml
  - python-dotenv
  - filelock
  # Visualization
  - matplotlib
  # CLI
  - questionary
  - rich
  # Service
  - uvicorn
  - fastapi
  # Dev dependencies
  - pytest
  - coverage
  - pre-commit
  - ruff
  - mypy
  - pandas-stubs
  - types-PyYAML
  - ipykernel
  # Documentation
  - sphinx
  - sphinx-rtd-theme
  - myst-parser
  - sphinxcontrib-mermaid
  # pip-only (stale or missing on conda-forge)
  - pip:
      - httpx
      - pydap
      - -e .
